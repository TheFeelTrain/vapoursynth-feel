[build-system]
requires = ["hatchling>=1.29.0", "hatch-vcs", "packaging", "cmake>=3.21", "vapoursynth>=74"]
build-backend = "hatchling.build"

[project]
name = "vapoursynth-feel"
dynamic = ["version"]
description = "GPU-accelerated VapourSynth filters (Vulkan)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "TheFeelTrain" }]
maintainers = [
    { name = "TheFeelTrain", email = "the@feeltra.in" }
]
dependencies = ["vapoursynth>=74"]

[dependency-groups]
dev = [
    "hatchling>=1.27.0",
    "packaging",
    "vsjetpack>=2.2",
    "numpy",
    "pytest",
    "pytest-xdist",
]

[project.urls]
"Source Code" = "https://github.com/TheFeelTrain/vapoursynth-feel"
"Bug Tracker" = "https://github.com/TheFeelTrain/vapoursynth-feel"

[tool.hatch.version]
source = "vcs"

# Patterns are anchored to the project root: a bare `vsfeel` also matches the
# staged `install/vapoursynth/plugins/vsfeel/` copy, which then ships whenever
# hatchling's gitignore filtering is unavailable (e.g. sdist builds under /tmp).
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/vsfeel",
    "/CMakeLists.txt",
    "/config.h.in",
    "/hatch_build.py",
    "/README.md",
    "/LICENSE",
]

# The plugin is x86-64 Linux and Windows (see the platform guard in
# hatch_build.py), so a wheel carries exactly one platform's library.
[tool.hatch.build.targets.wheel]
include = ["/vapoursynth/plugins/vsfeel", "/vsfeel"]
artifacts = [
    "/vapoursynth/plugins/vsfeel/*.so",
    "/vapoursynth/plugins/vsfeel/*.dll",
    "/vapoursynth/plugins/vsfeel/manifest.vs",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
addopts = "-p no:vsengine"