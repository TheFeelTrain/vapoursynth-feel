[build-system]
requires = ["hatchling>=1.29.0", "hatch-vcs", "cmake>=3.21", "vapoursynth>=80"]
build-backend = "hatchling.build"

[project]
name = "vapoursynth-feel"
dynamic = ["version"]
description = "GPU-accelerated filters in Vulkan for VapourSynth"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "TheFeelTrain" }]
maintainers = [
    { name = "TheFeelTrain", email = "the@feeltra.in" }
]
dependencies = ["vapoursynth>=80"]
keywords = ["vapoursynth", "vulkan", "gpu", "denoise", "deinterlace", "video"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: GPU",
    "Programming Language :: C++",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[dependency-groups]
dev = [
    "hatchling>=1.27.0",
    "packaging",
    "vsjetpack>=2.2",
    "numpy",
    "pytest",
    "pytest-xdist",
]

[project.urls]
"Source Code" = "https://github.com/TheFeelTrain/vapoursynth-feel"
"Bug Tracker" = "https://github.com/TheFeelTrain/vapoursynth-feel/issues"

[tool.hatch.version]
source = "vcs"

# Patterns are anchored to the project root: a bare `vsfeel` also matches the
# staged `install/vapoursynth/plugins/vsfeel/` copy, which then ships whenever
# hatchling's gitignore filtering is unavailable (e.g. sdist builds under /tmp).
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/vsfeel",
    "/tests",
    "/CMakeLists.txt",
    "/hatch_build.py",
    "/README.md",
    "/LICENSE",
]

# The plugin is Linux (x86-64 and arm64), macOS (x86-64 and arm64) and
# Windows x86-64 (see the platform guard in hatch_build.py), so a wheel
# carries exactly one platform's library.
[tool.hatch.build.targets.wheel]
include = ["/vapoursynth/plugins/vsfeel", "/vsfeel"]
artifacts = [
    "/vapoursynth/plugins/vsfeel/*.so",
    "/vapoursynth/plugins/vsfeel/*.dylib",
    "/vapoursynth/plugins/vsfeel/*.dll",
    "/vapoursynth/plugins/vsfeel/manifest.vs",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
addopts = "-p no:vsengine"

# Ruff gate config (tools/lint.sh `ruff`, CI lint.yml). Curated, not the
# default set: style rules the tree does not follow (line length,
# %-formatting, `zip(strict=)`) are excluded, so the gate only reports
# probable defects. The `noqa` comments in the tree must stay accurate.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]