[build-system]
requires = ["hatchling>=1.29.0", "hatch-vcs", "cmake>=4.4.3", "vapoursynth>=80"]
build-backend = "hatchling.build"

[project]
name = "vapoursynth-feel"
dynamic = ["version"]
description = "GPU-accelerated filters in Vulkan for VapourSynth"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "TheFeelTrain" }]
maintainers = [
    { name = "TheFeelTrain", email = "the@feeltra.in" }
]
dependencies = ["vapoursynth>=80"]
keywords = ["vapoursynth", "vulkan", "gpu", "denoise", "deinterlace", "video"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: GPU",
    "Programming Language :: C++",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Typing :: Typed",
]

[project.optional-dependencies]
jetpack = ["vsjetpack>=2.2"]

[dependency-groups]
test = [
    "hatchling>=1.29.0",
    "numpy",
    "packaging",
    "pytest",
    "pytest-xdist",
]

dev = [
    { include-group = "test" },
    "vapoursynth==81rc1",
    "vsjetpack>=2.2",
    "vapoursynth-bestsource>=22",
    "vapoursynth-edgemasks>=4.1",
    "vapoursynth-fmtconv>=31",
    "vapoursynth-resize2>=0.4.2",
    "vapoursynth-descale>=12",
    "vapoursynth-vszipcl",
    "vapoursynth-eedi3vk2>=1.0",
    "vapoursynth-nnedi3vk>=1.0",
    "vapoursynth-bm3dvk>=1.0",
    "vapoursynth-nlm-hip>=4",
    "vapoursynth-knlmeansvk>=2.0",
    "vapoursynth-zsmooth>=0.20",
    "vapoursynth-bm3d>=10.1",
]

lint = [
    "clang-format==22.1.8",
    "clang-tidy==22.1.8",
    "ruff==0.16.9",
]

[project.urls]
"Source Code" = "https://github.com/TheFeelTrain/vapoursynth-feel"
"Bug Tracker" = "https://github.com/TheFeelTrain/vapoursynth-feel/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/vsfeel",
    "/tests",
    "/tools",
    "/CMakeLists.txt",
    "/hatch_build.py",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.hatch.build.targets.wheel]
include = ["/vapoursynth/plugins/vsfeel", "/vsfeel"]
artifacts = [
    "/vapoursynth/plugins/vsfeel/*.so",
    "/vapoursynth/plugins/vsfeel/*.dylib",
    "/vapoursynth/plugins/vsfeel/*.dll",
    "/vapoursynth/plugins/vsfeel/manifest.vs",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.uv]
package = false
python-preference = "only-managed"

[[tool.uv.index]]
name = "vs-wheels"
url = "https://jaded-encoding-thaumaturgy.github.io/vs-wheels/simple"

[tool.uv.sources]
vapoursynth-fmtconv = { index = "vs-wheels" }
vapoursynth-vszipcl = { git = "https://github.com/dnjulek/vapoursynth-zipcl", rev = "2c1b97742bf4f086f0bd31d26ba630e834c661ed" }

[tool.pytest.ini_options]
addopts = "-p no:vsengine"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W291", "W292", "W293", "RUF100"]
