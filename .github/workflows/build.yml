name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0   # hatch-vcs derives the version from git tags
    - run: python -m pip install --upgrade build
    - run: python -m build --sdist --outdir dist
    - uses: actions/upload-artifact@v4
      with:
        name: sdist
        path: dist

  # Vulkan is loaded through volk at runtime, so the wheel links no libvulkan
  # and auditwheel can retag it to manylinux. Built in the manylinux image so
  # the glibc symbol floor is the policy's, not the runner's.
  linux-wheel:
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_34_x86_64
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install glslc
      run: dnf -y install glslc
    - name: Build and repair
      run: |
        PY=/opt/python/cp312-cp312/bin/python
        "$PY" -m pip install --upgrade build auditwheel
        "$PY" -m build --wheel --outdir dist
        "$PY" -m auditwheel repair --plat manylinux_2_34_x86_64 -w wheelhouse dist/*.whl
    - uses: actions/upload-artifact@v4
      with:
        name: linux-wheel
        path: wheelhouse

  windows-wheel:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        pacboy: >-
          git:p
          python:p
          python-pip:p
          shaderc:p
          toolchain:p
    - name: Build
      run: |
        python -m pip install --upgrade build
        python -m build --wheel --outdir dist
    - uses: actions/upload-artifact@v4
      with:
        name: windows-wheel
        path: dist

  publish:
    permissions:
      id-token: write   # PyPI trusted publishing
    needs: [sdist, linux-wheel, windows-wheel]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true
    - uses: pypa/gh-action-pypi-publish@release/v1
