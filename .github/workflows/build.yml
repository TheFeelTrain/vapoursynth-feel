name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0   # hatch-vcs derives the version from git tags
    - run: python -m pip install --upgrade build
    - run: python -m build --sdist --outdir dist
    - uses: actions/upload-artifact@v4
      with:
        name: sdist
        path: dist

  # Vulkan is loaded through volk at runtime, so the wheel links no libvulkan
  # and auditwheel can retag it to manylinux. Built in the manylinux image so
  # the glibc symbol floor is the policy's, not the runner's.
  linux-wheel:
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_34_x86_64
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install glslc
      run: dnf -y install glslc
    - name: Build and repair
      run: |
        PY=/opt/python/cp312-cp312/bin/python
        "$PY" -m pip install --upgrade build auditwheel
        "$PY" -m build --wheel --outdir dist
        "$PY" -m auditwheel repair --plat manylinux_2_34_x86_64 -w wheelhouse dist/*.whl
    - uses: actions/upload-artifact@v4
      with:
        name: linux-wheel
        path: wheelhouse

  windows-wheel:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        # No python:p / python-pip:p on purpose. MSYS2's Python is a mingw build,
        # so its platform tag is mingw_x86_64 and no PyPI wheel matches it: pip
        # then tries to build vapoursynth and cmake from source and dies. uv
        # brings its own managed win_amd64 CPython, which every wheel matches,
        # while the packaged toolchain supplies the compiler and glslc.
        pacboy: >-
          git:p
          ninja:p
          shaderc:p
          toolchain:p
          uv:p
    - name: Build
      env:
        # The packaged toolchain has no make/ninja default; CMake reads this.
        CMAKE_GENERATOR: Ninja
      run: |
        # MSYS2's git emulates POSIX file modes, so it invents an executable bit
        # for shebang files (src/gen_spirv_header.py, benchmark/bench.py) and
        # reports them as modified. setuptools_scm reads that as a dirty tree and
        # stamps a local version (+g<hash>.d<date>), which PyPI rejects. Line
        # endings can disagree between this git and the one that checked the tree
        # out, for the same reason. Normalise both and re-materialise the tree
        # from the commit before anything reads the version.
        git config --global core.filemode false
        git config --global core.autocrlf false
        git checkout -f -q HEAD -- .
        echo "--- tracked changes (must be empty) ---"
        git status --porcelain --untracked-files=no
        uv build --wheel --out-dir dist
    - uses: actions/upload-artifact@v4
      with:
        name: windows-wheel
        path: dist

  publish:
    permissions:
      id-token: write   # PyPI trusted publishing
    needs: [sdist, linux-wheel, windows-wheel]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true
    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        # A partially published release can be finished by re-running the
        # workflow: files PyPI already has are skipped instead of failing the
        # job, since PyPI never allows re-uploading a filename anyway.
        skip-existing: true

  release-assets:
    # Separate from the PyPI upload on purpose: the two channels are
    # independent, so whichever one fails, the other still completes.
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [sdist, linux-wheel, windows-wheel]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach assets to the release
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true
    - name: Attach the distributions to the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Create the release if the tag was pushed without one.
        gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 ||
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
        # Wheels and sdist only: dist/ also holds the .publish.attestation files
        # the PyPI action writes, which do not belong on the release page.
        # --clobber makes a re-run replace assets instead of failing.
        gh release upload "${GITHUB_REF_NAME}" dist/*.whl dist/*.tar.gz --clobber
