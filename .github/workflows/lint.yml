name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

# Same per-ref grouping as the build workflow: a superseded push's lint run has
# nothing to say about the commit that replaced it. Tags keep their own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint:
    # 26.04, not latest: noble's glslc is 2023.8 and rejects --target-env=vulkan1.4.
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7

    - name: System tools (glslc, spirv-val, cppcheck)
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          glslc spirv-tools cppcheck

    # The interpreter, VapourSynth and the pinned clang-format/clang-tidy/ruff
    # all come from uv.lock, so this job runs the environment a developer gets
    # from `uv sync --group lint`, and tools/lint.sh picks the venv binaries up
    # from PATH. The `dev` group (reference plugins) is not needed here, hence
    # --no-default-groups.
    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        enable-cache: true

    - name: Sync the lint environment
      run: uv sync --locked --no-default-groups --group lint

    - name: Configure (compile database on, host warnings as errors)
      run: |
        cmake -S . -B build \
          -D CMAKE_BUILD_TYPE=Release \
          -D CMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -D VSFEEL_WERROR=ON \
          -D Python3_EXECUTABLE="$PWD/.venv/bin/python"

    # Builds the host with -Werror and every shader with glslc -Werror, then
    # validates each emitted module with spirv-val (the shader-validate target).
    # Also prints every shader variant's workgroup/LDS footprint, so a variant
    # that outgrew its device limits is visible in the log next to the validation
    # that would otherwise pass it, and --checks it against the GpuWorkgroup
    # literals at each gpu_create_pipeline call site: the host's device-limit
    # check reads those numbers, so the two drifting apart is a real defect.
    # A stale .spv left behind by a dropped CMake variant is marked, so it
    # cannot pose as live.
    - name: Build
      run: cmake --build build --parallel

    - name: Shader limits
      run: |
        uv run --no-sync python tools/shader_limits.py
        uv run --no-sync python tools/shader_limits.py --check

    # Runs the shaders gate again (`shader-validate` plus the same --check), so
    # tools/lint.sh stays the single entry point a contributor runs locally.
    - name: Lint
      run: tools/lint.sh

  test:
    # GPU-less tests only: GitHub runners have no Vulkan device, so this runs
    # the tests that never touch the plugin — build plumbing (SPIR-V header
    # generator, benchmark vpy generation, wheel staging). Everything else
    # needs the installed GPU plugin and stays local (tools/test.sh).
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0   # hatch-vcs derives the version from git tags

    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        enable-cache: true

    - name: Sync the test environment
      run: uv sync --locked --no-default-groups --group test

    - name: GPU-less tests
      # The version test needs the installed GPU plugin, so it stays local;
      # these five never touch a device (header generator, benchmark vpy
      # generation, wheel staging).
      run: |
        uv run --no-sync python -m pytest tests/test_build.py -q \
          -k "generator or benchmark or hatch"
